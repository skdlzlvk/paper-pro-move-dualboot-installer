name: Validate public tree

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-tree:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Audit distributable files
        shell: pwsh
        run: ./tools/Test-PublicTree.ps1

      - name: Parse Windows preflight
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./installer/Invoke-PaperMovePreflight.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
